    <!-- HubSpot Chat -->
    <style>
      #hubspot-messages-iframe-container {
        transform: scale(0.75) !important;
        transform-origin: bottom right !important;
      }
      #hubspot-messages-iframe-container.active {
        transform: scale(1) !important;
      }
      @media (min-width: 768px) {
        #hubspot-messages-iframe-container.active {
          transform: scale(0.75) !important;
        }
      }
    </style>
    <script>
      window.hsConversationsSettings = { loadImmediately: false };
      (function () {
        var BOTTOM = "30px";
        var RIGHT = "30px";
        function applyPosition(el) {
          if (window.innerWidth >= 768) {
            el.style.setProperty("bottom", BOTTOM, "important");
            el.style.setProperty("right", RIGHT, "important");
          }
        }
        var observer = new MutationObserver(function () {
          var el = document.getElementById("hubspot-messages-iframe-container");
          if (el) applyPosition(el);
        });
        window.addEventListener("load", function () {
          var check = setInterval(function () {
            var el = document.getElementById(
              "hubspot-messages-iframe-container"
            );
            if (el) {
              clearInterval(check);
              applyPosition(el);
              observer.observe(el, {
                attributes: true,
                attributeFilter: ["style"],
              });
            }
          }, 300);
        });
      })();
    </script>
    <script>
      (function () {
        var loaded = false;
        function loadHS() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement("script");
          s.type = "text/javascript";
          s.id = "hs-script-loader";
          s.async = true;
          s.defer = true;
          s.src = "//js.hs-scripts.com/246153175.js";
          document.head.appendChild(s);
        }
        ["scroll", "mousemove", "keydown", "touchstart", "click"].forEach(function (e) {
          window.addEventListener(e, loadHS, { once: true, passive: true });
        });
        // Fallback: load after 5s even without interaction
        setTimeout(loadHS, 5000);
      })();
    </script>
